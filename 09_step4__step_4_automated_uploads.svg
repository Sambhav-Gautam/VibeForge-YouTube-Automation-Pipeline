    <rect x="184" y="74" width="912" height="5" rx="3" fill="url(#accentH)"/>
    
<text x="200" y="200" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">Description:</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">*</tspan></text>
<text x="200" y="238" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">GitHub Actions schedules uploads for six channels and a general daily</tspan></text>
<text x="200" y="268" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">upload.</tspan></text>
<text x="200" y="306" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">Workflow Schedules (IST):</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">*</tspan></text>
<text x="200" y="336" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">AI Models</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Every alternate day, 4 AM (`30 22 </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">/2 </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> *`)</tspan></text>
<text x="200" y="366" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">BrainRot</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Every alternate day, 9 PM (`30 15 </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">/2 </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> *`)</tspan></text>
<text x="200" y="396" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">BrainRotMemes</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Every alternate day, 7 PM (`30 13 </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">/2 </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> *`)</tspan></text>
<text x="200" y="426" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">GenZ</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Every alternate day, 5 AM (`30 23 </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">/2 </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> *`)</tspan></text>
<text x="200" y="456" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">Illusions</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Every alternate day, 7 AM (`30 1 </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">/2 </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> *`)</tspan></text>
<text x="200" y="486" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">Motivational</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Daily, 1 AM (`30 19 </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> *`)</tspan></text>
<text x="200" y="516" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">General Upload</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Daily, 11 PM (`30 17 </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> *`)</tspan></text>
<text x="200" y="554" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">Setup:</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">*</tspan></text>
<text x="200" y="592" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">1) Add base64-encoded secrets to GitHub:</tspan></text>
<text x="200" y="630" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> `CLIENT_SECRET_&lt;CHANNEL&gt;_B64`, `TOKEN_&lt;CHANNEL&gt;_B64` for each</tspan></text>
<text x="200" y="660" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">channel.</tspan></text>
<text x="200" y="690" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> `MOTIVATIONAL_SECRET`, `MOTIVATIONAL_PICKLE`,</tspan></text>
<text x="200" y="720" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">`YT_REFRESH_TOKEN_JSON`</tspan></text>
<text x="200" y="758" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">2) Ensure upload scripts (e.g., `ai_models_upload.py`) are in channel</tspan></text>
<text x="200" y="788" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">folders.</tspan></text>
<rect x="184" y="1090" width="912" height="7" rx="4" fill="url(#accentH)"/>
