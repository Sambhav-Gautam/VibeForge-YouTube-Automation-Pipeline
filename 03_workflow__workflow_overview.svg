<text x="200" y="328" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">  |               |                    |                        |</tspan></text>
<text x="200" y="358" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">|                   |</tspan></text>
<text x="200" y="388" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">  Prompt         90–100 Images      Downloads to           5s Shorts</tspan></text>
<text x="200" y="418" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">with      Scheduled Uploads   Vercel Dashboard</tspan></text>
