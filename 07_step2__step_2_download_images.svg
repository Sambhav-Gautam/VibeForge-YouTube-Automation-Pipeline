<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1276" viewBox="0 0 1280 1276" role="img" aria-label="Step 2: Download Images">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#6ee7b7"/>
      </linearGradient>
      <radialGradient id="blob1" cx="20%" cy="10%" r="40%">
        <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blob2" cx="85%" cy="25%" r="45%">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.4)"/>
      </filter>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <!-- misty blobs -->
    <circle cx="230.39999999999998" cy="229.67999999999998" r="448.0" fill="url(#blob1)"/>
    <circle cx="1049.6" cy="357.28000000000003" r="512.0" fill="url(#blob2)"/>
    <!-- frosted panel -->
    <g filter="url(#shadow)">
      <rect x="128" y="80" width="1024" height="1136" rx="28" ry="28" fill="rgba(255,255,255,0.06)"/>
    </g>
    <!-- Title -->
    <text x="640.0" y="65" text-anchor="middle" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#accent)">Step 2: Download Images</text>
    <rect x="128" y="92" width="1024" height="6" rx="3" fill="url(#accent)"/>
    
<text x="150" y="220" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-style="italic" opacity="0.92">Description:</tspan><tspan dx="0">*</tspan></text>
<text x="150" y="266" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">Scrape Gemini share links to download images using a stealth </tspan><tspan dx="0" font-weight="800" fill="url(#accent)">Puppeteer</tspan><tspan dx="0"> script.</tspan></text>
<text x="150" y="312" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-style="italic" opacity="0.92">Usage:</tspan><tspan dx="0">*</tspan></text>
<text x="150" y="358" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">1) Get a Gemini share link via the “Share” button.</tspan></text>
<text x="150" y="396" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">2) Navigate to `ChatBotAutomation/gemini-downloader`.</tspan></text>
<text x="150" y="434" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">3) Update `gemini.js`:</tspan></text>
<g filter="url(#softGlow)">
<rect x="150" y="474" width="980" height="124" rx="14" ry="14" fill="rgba(3, 63, 48, 0.72)" />
</g>
<text x="166" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="24" fill="rgb(210, 255, 235)">
<tspan x="166" dy="0"></tspan>
<tspan x="166" dy="32">const URL = 'YOUR_GEMINI_SHARE_LINK_HERE';</tspan>
</text>
<text x="150" y="620" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">4) Run: `node gemini.js`</tspan></text>
<text x="150" y="658" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">5) Images save to `ChatBotAutomation/gemini-do​wnloader/downloads_&lt;channel&gt;​`.</tspan></text>
<text x="150" y="704" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-style="italic" opacity="0.92">Features:</tspan><tspan dx="0">*</tspan></text>
<text x="150" y="742" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• Auto-scrolls and extracts `.jpg`/`.png` URLs.</tspan></text>
<text x="150" y="780" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• Retry handling and detailed logging.</tspan></text>
<rect x="128" y="1180" width="1024" height="8" rx="4" fill="url(#accent)"/>
</svg>