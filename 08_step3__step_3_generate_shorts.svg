<rect x="200" y="558" width="880" height="1" fill="rgba(125, 211, 252, 0.06)"/>
<rect x="200" y="578" width="880" height="1" fill="rgba(125, 211, 252, 0.06)"/>
<rect x="200" y="598" width="880" height="1" fill="rgba(125, 211, 252, 0.06)"/>
<rect x="200" y="618" width="880" height="1" fill="rgba(125, 211, 252, 0.06)"/>
<text x="212" y="426" font-family="Consolas, 'SFMono-Regular', Menlo, Monaco, 'Liberation Mono', 'Courier New', monospace" font-size="18" fill="rgba(203,213,225,0.95)" font-weight="700">
<tspan x="212" dy="0"></tspan>
<tspan x="212" dy="30">1</tspan>
<tspan x="212" dy="30">2</tspan>
<tspan x="212" dy="30">3</tspan>
<tspan x="212" dy="30">4</tspan>
<tspan x="212" dy="30">5</tspan>
</text>
<text x="258" y="426" font-family="Consolas, 'SFMono-Regular', Menlo, Monaco, 'Liberation Mono', 'Courier New', monospace" font-size="20" font-weight="700">
<tspan x="258" dy="0"></tspan>
<tspan x="258" dy="30"><tspan fill="#569cd6">from moviepy.editor </tspan><tspan fill="#569cd6">import ImageClip, AudioFileClip</tspan></tspan>
<tspan x="258" dy="30"><tspan fill="#d4d4d4">clip = ImageClip(image_path, duration=</tspan><tspan fill="#b5cea8">5).resize(width=</tspan><tspan fill="#b5cea8">1080)</tspan></tspan>
<tspan x="258" dy="30"><tspan fill="#d4d4d4">audio_clip = AudioFileClip(music_path).subclip(</tspan><tspan fill="#b5cea8">0, </tspan><tspan fill="#b5cea8">5).volumex(</tspan><tspan fill="#b5cea8">0.2)</tspan></tspan>
<tspan x="258" dy="30"><tspan fill="#d4d4d4">final_clip = clip.set_audio(audio_clip)</tspan></tspan>
<tspan x="258" dy="30"><tspan fill="#d4d4d4">final_clip.write_videofile(</tspan><tspan fill="#ce9178">"short.mp4"</tspan><tspan fill="#d4d4d4">, fps=</tspan><tspan fill="#b5cea8">30, codec=</tspan><tspan fill="#ce9178">"libx264"</tspan><tspan fill="#d4d4d4">)</tspan></tspan>
</text>
<text x="200" y="656" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">Output:</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">*</tspan></text>
<text x="200" y="686" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> Saved to `&lt;channel&gt;_automation/Content`</tspan></text>
<text x="200" y="716" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> Format: 1080x1920, 30fps, platform-ready</tspan></text>
<text x="200" y="746" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> Includes fade-in/out and random music from `youtube_music`</tspan></text>
