<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1352" viewBox="0 0 1280 1352" role="img" aria-label="Step 3: Generate Shorts">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#6ee7b7"/>
      </linearGradient>
      <radialGradient id="blob1" cx="20%" cy="10%" r="40%">
        <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blob2" cx="85%" cy="25%" r="45%">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.4)"/>
      </filter>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <!-- misty blobs -->
    <circle cx="230.39999999999998" cy="243.35999999999999" r="448.0" fill="url(#blob1)"/>
    <circle cx="1049.6" cy="378.56000000000006" r="512.0" fill="url(#blob2)"/>
    <!-- frosted panel -->
    <g filter="url(#shadow)">
      <rect x="128" y="80" width="1024" height="1212" rx="28" ry="28" fill="rgba(255,255,255,0.06)"/>
    </g>
    <!-- Title -->
    <text x="640.0" y="65" text-anchor="middle" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#accent)">Step 3: Generate Shorts</text>
    <rect x="128" y="92" width="1024" height="6" rx="3" fill="url(#accent)"/>
    
<text x="150" y="220" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-style="italic" opacity="0.92">Description:</tspan><tspan dx="0">*</tspan></text>
<text x="150" y="266" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">Convert images into </tspan><tspan dx="0" font-weight="800" fill="url(#accent)">5-second Shorts</tspan><tspan dx="0"> with music and transitions.</tspan></text>
<text x="150" y="312" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-style="italic" opacity="0.92">Usage:</tspan><tspan dx="0">*</tspan></text>
<text x="150" y="358" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">1) Navigate to `Python-Scripts`.</tspan></text>
<text x="150" y="396" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">2) Run: `python file.py`</tspan></text>
<text x="150" y="434" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">3) Example script:</tspan></text>
<g filter="url(#softGlow)">
<rect x="150" y="474" width="980" height="252" rx="14" ry="14" fill="rgba(3, 63, 48, 0.72)" />
</g>
<text x="166" y="500" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="24" fill="rgb(210, 255, 235)">
<tspan x="166" dy="0"></tspan>
<tspan x="166" dy="32">from moviepy.editor import ImageClip, AudioFileClip</tspan>
<tspan x="166" dy="32">clip = ImageClip(image_path, duration=5).resize(width=1080)</tspan>
<tspan x="166" dy="32">audio_clip = AudioFileClip(music_path).subclip(0, 5).volumex(0.2)</tspan>
<tspan x="166" dy="32">final_clip = clip.set_audio(audio_clip)</tspan>
<tspan x="166" dy="32">final_clip.write_videofile("short.mp4", fps=30, codec="libx264")</tspan>
</text>
<text x="150" y="748" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-style="italic" opacity="0.92">Output:</tspan><tspan dx="0">*</tspan></text>
<text x="150" y="786" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• Saved to `&lt;channel&gt;_automation/Content`</tspan></text>
<text x="150" y="824" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• Format: 1080x1920, 30fps, platform-ready</tspan></text>
<text x="150" y="862" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• Includes fade-in/out and random music from `youtube_music`</tspan></text>
<rect x="128" y="1256" width="1024" height="8" rx="4" fill="url(#accent)"/>
</svg>