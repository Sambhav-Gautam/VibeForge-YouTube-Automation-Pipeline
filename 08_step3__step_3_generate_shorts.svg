<text x="200" y="200" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">Description:</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">*</tspan></text>
<text x="200" y="238" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">Convert images into </tspan><tspan font-weight="900" fill="url(#accentH)">5-second Shorts</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> with music and transitions.</tspan></text>
<text x="200" y="276" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-style="italic" font-weight="700" fill="rgba(255,255,255,0.98)">Usage:</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">*</tspan></text>
<text x="200" y="314" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">1) Navigate to `Python-Scripts`.</tspan></text>
<text x="200" y="344" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">2) Run: `python file.py`</tspan></text>
<text x="200" y="374" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">3) Example script:</tspan></text>
<g><rect x="200" y="398" width="880" height="232" rx="14" ry="14" fill="#1e1e1e"/></g>
<rect x="200" y="398" width="6" height="232" fill="url(#accentH)" />
<rect x="200" y="398" width="880" height="1" fill="rgba(125, 211, 252, 0.06)"/>
