<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2036" viewBox="0 0 1280 2036" role="img" aria-label="Project Structure">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#6ee7b7"/>
      </linearGradient>
      <radialGradient id="blob1" cx="20%" cy="10%" r="40%">
        <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blob2" cx="85%" cy="25%" r="45%">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.4)"/>
      </filter>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <!-- misty blobs -->
    <circle cx="230.39999999999998" cy="366.47999999999996" r="448.0" fill="url(#blob1)"/>
    <circle cx="1049.6" cy="570.08" r="512.0" fill="url(#blob2)"/>
    <!-- frosted panel -->
    <g filter="url(#shadow)">
