<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-label="Best Practices">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064e3b"/><stop offset="100%" stop-color="#10b981"/>
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#6ee7b7"/>
      </linearGradient>
      <radialGradient id="blob1" cx="20%" cy="10%" r="40%">
        <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="blob2" cx="85%" cy="25%" r="45%">
        <stop offset="0%" stop-color="#34d399" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.4)"/>
      </filter>
      <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <!-- misty blobs -->
    <circle cx="230.39999999999998" cy="162.0" r="448.0" fill="url(#blob1)"/>
    <circle cx="1049.6" cy="252.00000000000003" r="512.0" fill="url(#blob2)"/>
    <!-- frosted panel -->
    <g filter="url(#shadow)">
      <rect x="128" y="80" width="1024" height="760" rx="28" ry="28" fill="rgba(255,255,255,0.06)"/>
    </g>
    <!-- Title -->
    <text x="640.0" y="65" text-anchor="middle" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#accent)">Best Practices</text>
    <rect x="128" y="92" width="1024" height="6" rx="3" fill="url(#accent)"/>
    
<text x="150" y="220" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-weight="800" fill="url(#accent)">Batch Size</tspan><tspan dx="0">: Limit Gemini generations to 90–100 images.</tspan></text>
<text x="150" y="258" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-weight="800" fill="url(#accent)">Multiple Accounts</tspan><tspan dx="0">: Use personal Gemini accounts for scale.</tspan></text>
<text x="150" y="296" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-weight="800" fill="url(#accent)">Naming</tspan><tspan dx="0">: Keep channel and output names consistent.</tspan></text>
<text x="150" y="334" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-weight="800" fill="url(#accent)">Music Refresh</tspan><tspan dx="0">: Update `youtube_music` regularly.</tspan></text>
<text x="150" y="372" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="30" fill="rgba(255,255,255,0.9)"><tspan dx="0">• </tspan><tspan dx="0" font-weight="800" fill="url(#accent)">Security</tspan><tspan dx="0">: Store API credentials in GitHub Secrets.</tspan></text>
<rect x="128" y="804" width="1024" height="8" rx="4" fill="url(#accent)"/>
</svg>