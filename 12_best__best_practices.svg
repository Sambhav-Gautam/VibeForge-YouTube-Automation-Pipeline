<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-label="Best Practices">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0b1221"/><stop offset="100%" stop-color="#0e2b4a"/>
      </linearGradient>
      <linearGradient id="accentH" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#5eead4"/>
      </linearGradient>
      <radialGradient id="orb1" cx="18%" cy="16%" r="40%">
        <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.20"/><stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orb2" cx="84%" cy="28%" r="40%">
        <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <circle cx="256.0" cy="165.6" r="460.79999999999995" fill="url(#orb1)"/>
    <circle cx="1024.0" cy="257.6" r="460.79999999999995" fill="url(#orb2)"/>
    <rect x="184" y="50" width="912" height="810" rx="22" ry="22" fill="rgba(255,255,255,0.05)"/>
    <text x="640.0" y="40" text-anchor="middle" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#accentH)">Best Practices</text>
    <rect x="184" y="74" width="912" height="5" rx="3" fill="url(#accentH)"/>
    
<text x="200" y="200" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">Batch Size</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Limit Gemini generations to 90–100 images.</tspan></text>
<text x="200" y="230" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">Multiple Accounts</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Use personal Gemini accounts for scale.</tspan></text>
<text x="200" y="260" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">Naming</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Keep channel and output names consistent.</tspan></text>
<text x="200" y="290" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">Music Refresh</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Update `youtube_music` regularly.</tspan></text>
<text x="200" y="320" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="900" fill="url(#accentH)">•</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> </tspan><tspan font-weight="900" fill="url(#accentH)">Security</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: Store API credentials in GitHub Secrets.</tspan></text>
<rect x="184" y="830" width="912" height="7" rx="4" fill="url(#accentH)"/>
</svg>