<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-label="Quick Start">

    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0b1221"/><stop offset="100%" stop-color="#0e2b4a"/>
      </linearGradient>
      <linearGradient id="accentH" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#5eead4"/>
      </linearGradient>
      <radialGradient id="orb1" cx="18%" cy="16%" r="40%">
        <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.20"/><stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orb2" cx="84%" cy="28%" r="40%">
        <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg)"/>
    <circle cx="256.0" cy="165.6" r="460.79999999999995" fill="url(#orb1)"/>
    <circle cx="1024.0" cy="257.6" r="460.79999999999995" fill="url(#orb2)"/>
    <rect x="184" y="50" width="912" height="810" rx="22" ry="22" fill="rgba(255,255,255,0.05)"/>
    <text x="640.0" y="40" text-anchor="middle" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="54" font-weight="900" fill="url(#accentH)">Quick Start</text>
    <rect x="184" y="74" width="912" height="5" rx="3" fill="url(#accentH)"/>
    
<text x="200" y="200" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">Get up and running in minutes:</tspan></text>
<text x="200" y="230" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">1) </tspan><tspan font-weight="900" fill="url(#accentH)">Clone the repo</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: `git clone</tspan></text>
<text x="200" y="260" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">https://github.com/your-​username/vibeforge-pipel​ine.git`</tspan></text>
<text x="200" y="290" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">2) </tspan><tspan font-weight="900" fill="url(#accentH)">Set up Python</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: `python -m venv .vnev &amp;&amp; source .vnev/bin/activate</tspan></text>
<text x="200" y="320" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">&amp;&amp; pip install -r Requirements.txt`</tspan></text>
<text x="200" y="350" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">3) </tspan><tspan font-weight="900" fill="url(#accentH)">Install Node.js dependencies</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: `npm install`</tspan></text>
<text x="200" y="380" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">4) </tspan><tspan font-weight="900" fill="url(#accentH)">Configure YouTube API credentials</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> in GitHub Secrets (see </tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">Step</tspan></text>
<text x="200" y="410" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">4</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">).</tspan></text>
<text x="200" y="440" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">5) </tspan><tspan font-weight="900" fill="url(#accentH)">Run</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: `node ChatBotAutomation/gemini​-downloader/gemini.js` to</tspan></text>
<text x="200" y="470" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">download images.</tspan></text>
<text x="200" y="500" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">6) </tspan><tspan font-weight="900" fill="url(#accentH)">Run</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)">: `python Python-Scripts/file.py` to generate Shorts.</tspan></text>
<text x="200" y="530" font-family="Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="23" fill="rgba(255,255,255,0.98)"><tspan font-weight="700" fill="rgba(255,255,255,0.98)">7) </tspan><tspan font-weight="900" fill="url(#accentH)">Check</tspan><tspan font-weight="700" fill="rgba(255,255,255,0.98)"> the Vercel Dashboard for analytics.</tspan></text>
<rect x="184" y="830" width="912" height="7" rx="4" fill="url(#accentH)"/>
</svg>